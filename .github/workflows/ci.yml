# Baseline CI (BP-6). Four stages: lint, test, contracts, secrets.
#
# Rules this file follows:
#   * Every stage calls a `make` target so `make verify` locally runs exactly what CI runs.
#   * No secrets, no customer environments, no cluster access. `permissions` is read-only
#     and no job receives a secret. Signing keys never enter CI.
#   * Job names `lint`, `test`, `contracts` match the required status checks in
#     docs/github-workflow.md §6. `e2e` and conformance stages are added by NWT-064 / NWT-083.
name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOLANGCI_LINT_VERSION: v2.13.1
  HELM_VERSION: v3.19.0
  OPA_VERSION: v1.9.0
  GITLEAKS_VERSION: 8.21.2
  CHECK_JSONSCHEMA_VERSION: 0.33.0
  REDOCLY_CLI_VERSION: 1.34.3

jobs:
  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: '**/go.sum'
      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/HEAD/install.sh \
            | sh -s -- -b "$(go env GOPATH)/bin" "$GOLANGCI_LINT_VERSION"
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - uses: azure/setup-helm@v4
        with:
          version: ${{ env.HELM_VERSION }}
      - name: Lint Go modules
        run: make lint
      - name: Lint Helm charts
        run: make lint-charts

  test:
    name: test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: open-policy-agent/setup-opa@v2
        with:
          version: ${{ env.OPA_VERSION }}
      - name: Unit tests and Rego policy tests
        run: make test

  contracts:
    name: contracts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: operator/go.mod
          cache-dependency-path: '**/go.sum'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install schema tooling
        run: |
          pip install --quiet "check-jsonschema==$CHECK_JSONSCHEMA_VERSION"
          npm install --global --no-fund --no-audit "@redocly/cli@$REDOCLY_CLI_VERSION"
      - name: Validate schemas and OpenAPI contract
        run: make validate-schemas
      - name: Validate example module metadata
        run: make validate
      - name: Generated artefacts are up to date
        run: make check-generated

  secrets:
    name: secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # scan history, not just the tip
      - name: Install gitleaks
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
      - name: No private keys or licences in the repository
        run: make check-secrets
