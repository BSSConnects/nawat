[project]
name = "nawat-cli"
version = "0.2.5"
description = "BSSConnects command-line interface"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
dependencies = [
    "click>=8.1",
    "requests>=2.31",
]

[project.scripts]
bssconnectsctl = "nawat_cli.main:cli"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
